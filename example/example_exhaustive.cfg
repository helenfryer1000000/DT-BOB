### Config: exact Doublethink by enumerating all 2^15 models (small nu only)

# Give this run a name
outname="example_exhaustive"

## Method
method="exhaustive"

## Files and folders (paths are relative to the repository folder: run from there)
# Input data as csv
input_filename="example/features.csv"
# Name of the ID column in input_filename
idcol="eid"
# Name of the phenotype column in cases_filename
phenocol="pheno"
# CSV containing the name of the columns and their type: double, float, integer, factor
columns_filename="example/columns.csv"
# CSV containing IDs and phenotypes
cases_filename="example/outcomes.csv"
# IDs to exclude. Every id is a new line
exclude_filename="example/exclude_rows.csv"
# Columns to exclude
exclude_columns="example/exclude_columns.csv"
# Results go to workdir/outname
workdir="output"

## Model and prior (same meaning as for the MCMC)
# GLM family: gaussian, binomial or poisson
glm_family="gaussian"
# Include an intercept?
intercept="false"
# Prior odds of including each variable
mu_prior=0.1
# Prior effect-size scale (1 = AIC-like, n = BIC-like)
h_prior=1
# Maximum number of levels of a factor
nlevmax=50
